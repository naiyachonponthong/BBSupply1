<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบพัสดุ งานธนาคารเลือด</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#129656;</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/theme.css?v=20260824-2" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4A121E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="พัสดุธนาคารเลือด">
</head>
<body>


  <!-- ==================== หน้าเข้าสู่ระบบ ==================== -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark"><i class="bi bi-droplet-half"></i></div>
        <div>
          <div class="login-title" id="loginAppName">ระบบพัสดุ งานธนาคารเลือด</div>
          <div class="login-sub" id="loginOrgName"></div>
        </div>
      </div>
      <div class="login-body">
        <div class="mb-3">
          <label class="form-label">ชื่อผู้ใช้</label>
          <input type="text" class="form-control" id="lgUser" autocomplete="username" autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">รหัสผ่าน</label>
          <input type="password" class="form-control" id="lgPass" autocomplete="current-password">
        </div>
        <div id="lgError" class="alert alert-danger py-2 px-3 d-none small"></div>
        <button class="btn btn-brand w-100" id="lgBtn">เข้าสู่ระบบ</button>
      </div>
      <div class="login-foot">ระบบภายในหน่วยงาน · ใช้บัญชีที่ผู้ดูแลระบบออกให้</div>
    </div>
  </div>

  <!-- ==================== แอปหลัก ==================== -->
  <div id="appView" class="d-none">

    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="side-mark"><i class="bi bi-droplet-half"></i></div>
        <div class="side-brand-text">
          <div class="side-app" id="sideAppName">ระบบพัสดุ</div>
          <div class="side-org">งานธนาคารเลือด</div>
        </div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <span id="sideVersion">v1.0</span>
      </div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop"></div>

    <header class="topbar">
      <button class="btn-burger" id="btnBurger" type="button" aria-label="เมนู"><i class="bi bi-list"></i></button>
      <div class="top-org" id="topOrgName"></div>
      <div class="top-right">
        <button class="btn-icon" id="btnBell" type="button" aria-label="แจ้งเตือน"><i class="bi bi-bell"></i></button>
        <div class="top-user">
          <div class="tu-name" id="tuName"></div>
          <div class="tu-role" id="tuRole"></div>
        </div>
        <div class="avatar" id="tuAvatar">?</div>
        <button class="btn-icon" id="btnLogout" type="button" aria-label="ออกจากระบบ"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>

    <main class="content" id="pageBody"></main>
  </div>

  <!-- ==================== Modal กลาง (ใช้ตัวเดียวทั้งระบบ) ==================== -->
  <div class="modal fade" id="bbsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" id="bbsModalDialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="bbsModalTitle">แบบฟอร์ม</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
        </div>
        <div class="modal-body" id="bbsModalBody"></div>
        <div class="modal-footer" id="bbsModalFoot">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-brand" id="bbsModalSave">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div id="printArea"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js?v=20260824-2"></script>
<script src="js/api.js?v=20260824-2"></script>
<script src="js/ui.js?v=20260824-2"></script>
<script src="js/auth.js?v=20260824-2"></script>
<script src="js/pages/dashboard.js?v=20260824-2"></script>
<script src="js/pages/master.js?v=20260824-2"></script>
<script src="js/pages/stock.js?v=20260824-2"></script>
<script src="js/pages/issue.js?v=20260824-2"></script>
<script src="js/pages/scan.js?v=20260824-2"></script>
<script src="js/pages/reports.js?v=20260824-2"></script>
<script src="js/pages/settings.js?v=20260824-2"></script>
<script src="js/app.js?v=20260824-2"></script>
</body>
</html>
